services:
  redis-cache:
    image: docker.io/library/redis:7.4-alpine
    container_name: forrad-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - forrad-net-v2

  weather-proxy:
    build:
      context: ./weather-proxy
    ports:
      - "5000:5000"
    container_name: forrad-weather-proxy
    restart: always
    environment:
      - REDIS_IP=redis-cache
      - REDIS_PORT=6379
    env_file:
      - .env
    networks:
      - forrad-net-v2
    depends_on:
      - redis-cache

  forrad-alerts:
    build: ./forrad-alerts
    container_name: forrad-alerts-daemon
    restart: unless-stopped
    environment:
      # Matches the os.getenv() in your Python script perfectly
      - REDIS_IP=redis-cache
      # No REDIS_PASSWORD needed since our internal Redis container doesn't enforce auth by default
    networks:
      - forrad-net-v2
    depends_on:
      - redis-cache

  forcast-radar-app:
    build: ./forcast-radar-app
    container_name: forrad-nextjs-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - forrad-net-v2
    depends_on:
      - weather-proxy
      - nomads-daemon

  nomads-daemon:
    build: ./nomads-backend
    container_name: forrad-nomads-daemon
    restart: unless-stopped
    ports:
      - "5001:5001"
    networks:
      - forrad-net-v2

networks:
  forrad-net-v2:
    driver: bridge
