# ==============================================================================
# ForRad V2: W3C Design Tokens Community Group (DTCG) Specification
# Single Source of Truth (SSOT) for Visual & Spatial Variables
# ==============================================================================

$schema: "https://designtokens.org/schemas/v2025.10/token.yaml"

primitive:
  color:
    cyan:
      400:
        $value: "#22d3ee"
        $type: "color"
      500:
        $value: "#00c4f5"
        $type: "color"
    blue:
      600:
        $value: "#2563eb"
        $type: "color"
    red:
      500:
        $value: "#ef4444"
        $type: "color"
      600:
        $value: "#dc2626"
        $type: "color"
    orange:
      500:
        $value: "#f97316"
        $type: "color"
      600:
        $value: "#ea580c"
        $type: "color"
    yellow:
      400:
        $value: "#facc15"
        $type: "color"
      500:
        $value: "#eab308"
        $type: "color"
    teal:
      500:
        $value: "#14b8a6"
        $type: "color"
    slate:
      400:
        $value: "#94a3b8"
        $type: "color"
      700:
        $value: "#334155"
        $type: "color"
      800:
        $value: "#1e293b"
        $type: "color"
      900:
        $value: "#0f172a"
        $type: "color"
      950:
        $value: "#020617"
        $type: "color"
    black:
      $value: "#000000"
      $type: "color"
  font:
    archivo:
      $value: "var(--font-archivo), sans-serif"
      $type: "fontFamily"
  duration:
    fast:
      $value: "150ms"
      $type: "duration"
    normal:
      $value: "300ms"
      $type: "duration"

semantic:
  threat:
    extreme:
      $value: "{primitive.color.red.600}"
      $type: "color"
      $description: "Tornado Warnings / Extreme Threats"
    severe:
      $value: "{primitive.color.yellow.400}"
      $type: "color"
      $description: "Severe Thunderstorm Warnings"
    moderate:
      $value: "{primitive.color.teal.500}"
      $type: "color"
      $description: "Flash Flood Warnings / Moderate Threats"
    statement:
      $value: "{primitive.color.orange.500}"
      $type: "color"
      $description: "Special Weather Statements"
    advisory:
      $value: "{primitive.color.slate.400}"
      $type: "color"
      $description: "Minor Weather Advisories"
  surface:
    base:
      $value: "{primitive.color.slate.950}"
      $type: "color"
    dashboard:
      $value: "{primitive.color.slate.900}"
      $type: "color"
    card:
      $value: "{primitive.color.slate.800}"
      $type: "color"
    telemetry:
      $value: "{primitive.color.cyan.500}"
      $type: "color"
  elevation:
    map:
      $value: 0
      $type: "number"
    rail:
      $value: 100
      $type: "number"
    toast:
      $value: 1500
      $type: "number"
    hud:
      $value: 2000
      $type: "number"
    drawer:
      $value: 3000
      $type: "number"
    sidebar:
      $value: 4000
      $type: "number"
